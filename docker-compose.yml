version: "3.9"

services:
  # ============================================================
  # BACKEND API
  # ============================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      - NODE_ENV=development
      - APP_HOST=0.0.0.0
      - DATABASE_URL=postgresql://recurra:recurra_dev@postgres:5432/recurra_dev
      - REDIS_URL=redis://redis:6379
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    restart: unless-stopped
    networks:
      - recurra-network

  # ============================================================
  # PostgreSQL DATABASE
  # ============================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recurra
      POSTGRES_PASSWORD: recurra_dev
      POSTGRES_DB: recurra_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recurra -d recurra_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - recurra-network

  # ============================================================
  # REDIS (Cache + Queue + Checkpoint)
  # ============================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - recurra-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  recurra-network:
    driver: bridge
