[workspace]
members = [
    "authorization",
    "subscription-factory",
    "payment-engine",
    "token-wrapper",
    "escrow",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "22.0.10"
soroban-token-interface = "22.0.10"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
